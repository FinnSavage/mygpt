[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mygpt"
version = "0.1.0"
description = "A small, cross-platform GPT you can train and run on your own machine."
requires-python = ">=3.10,<3.15"
dependencies = [
    "numpy",
    "gradio",
    "pandas",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
mygpt = "mygpt.cli:main"

[tool.setuptools.packages.find]
include = ["mygpt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
